name: Cloudflare Guard

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare build safety
        run: npm run verify:cloudflare
