name: Realtime Sync

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'backend-skeleton/**'
      - 'src/hooks/useRealtimeSync.js'
      - 'src/hooks/useRealtimeSync.test.js'
      - '.github/workflows/realtime-sync.yml'

jobs:
  verify-realtime-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-skeleton/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.10.1

      - name: Install backend dependencies
        working-directory: backend-skeleton
        run: npm ci

      - name: Run backend unit tests
        working-directory: backend-skeleton
        run: npm test

      - name: Verify two-user reconnect sync
        working-directory: backend-skeleton
        run: npm run smoke:socket:emulator
