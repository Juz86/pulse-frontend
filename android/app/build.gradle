apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def pulseNativeUpdatePublicKeyFile = new File(
    rootProject.projectDir.parentFile,
    'security/native-update/public-key-spki-base64.txt'
)
def pulseNativeUpdatePublicKey = System.getenv('PULSE_NATIVE_UPDATE_PUBLIC_KEY')
    ?: (pulseNativeUpdatePublicKeyFile.exists()
        ? pulseNativeUpdatePublicKeyFile.getText('UTF-8').trim()
        : '')
def pulseE2eeInstrumentedTest = providers.gradleProperty('pulseE2eeInstrumentedTest')
    .map { it.toBoolean() }
    .getOrElse(false)
def pulseE2eeQa = providers.gradleProperty('pulseE2eeQa')
    .map { it.toBoolean() }
    .getOrElse(false)
def pulseE2eePilot = providers.gradleProperty('pulseE2eePilot')
    .map { it.toBoolean() }
    .getOrElse(false)
def pulseE2eeQaInstance = providers.gradleProperty('pulseE2eeQaInstance')
    .getOrElse('a')
if (pulseE2eeQa && pulseE2eePilot) {
    throw new GradleException('E2EE QA en de productiepilot mogen niet tegelijk actief zijn.')
}
if (!(pulseE2eeQaInstance ==~ /[a-z0-9]+/)) {
    throw new GradleException('pulseE2eeQaInstance mag alleen kleine letters en cijfers bevatten.')
}
android {
    namespace "com.pulsemessenger.chat"
    compileSdk rootProject.ext.compileSdkVersion
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    packaging {
        resources {
            excludes += ["libsignal_jni*.dylib", "signal_jni*.dll"]
        }
        jniLibs {
            excludes += ["**/libsignal_jni_testing.so"]
        }
    }
    defaultConfig {
        applicationId "com.pulsemessenger.chat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 80
        versionName "1.0.24"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Public half of the signing key only. The private key is a Cloudflare
        // Pages build secret and must never enter the Android project.
        buildConfigField "String", "PULSE_NATIVE_UPDATE_PUBLIC_KEY", "\"${pulseNativeUpdatePublicKey.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "PULSE_NATIVE_UPDATE_MANIFEST_URL", "\"https://web.pulse-messenger.com/native-updates/latest.json\""
        buildConfigField "boolean", "PULSE_E2EE_QA_ENABLED", pulseE2eeQa.toString()
        buildConfigField "boolean", "PULSE_E2EE_PILOT_ENABLED", pulseE2eePilot.toString()
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            if (pulseE2eeQa) {
                // QA instances use isolated app identities and Android Keystores.
                def qaSuffix = pulseE2eeQaInstance == 'a' ? '' : pulseE2eeQaInstance
                applicationIdSuffix ".e2eeqa${qaSuffix}"
                versionNameSuffix pulseE2eeQaInstance == 'a'
                    ? '-e2ee-qa'
                    : "-e2ee-qa-${pulseE2eeQaInstance}"
            } else if (pulseE2eeInstrumentedTest) {
                // Keep the E2EE test APK isolated from the Play Store app.
                applicationIdSuffix ".e2eetest"
                versionNameSuffix "-e2ee-test"
            }
        }
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            ndk {
                // Upload dit symbolenpakket in Play Console voor betere native crash/ANR analyses.
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

if (pulseE2eeInstrumentedTest || pulseE2eeQa) {
    // Secure-store tests do not start Firebase and use an isolated package ID
    // that intentionally has no production Firebase client registration.
    tasks.matching { it.name == 'processDebugGoogleServices' }.configureEach {
        enabled = false
    }
}

tasks.matching { it.name.toLowerCase().contains('release') }.configureEach {
    doFirst {
        if (pulseE2eeQa) {
            throw new GradleException('E2EE QA mag uitsluitend als debug-APK worden gebouwd.')
        }
    }
}

tasks.matching { it.name == 'connectedDebugAndroidTest' }.configureEach {
    doFirst {
        if (!pulseE2eeInstrumentedTest) {
            throw new GradleException(
                'Gebruik -PpulseE2eeInstrumentedTest=true zodat instrumentatietests '
                    + 'de geinstalleerde Play Store-app niet vervangen.'
            )
        }
    }
}

def releaseMainBundles = fileTree(
    dir: file('src/main/assets/public/static/js'),
    include: ['main*.js']
)

def pulseProjectDir = rootProject.projectDir.parentFile

def buildReleaseWebAssets = tasks.register('buildReleaseWebAssets', Exec) {
    workingDir pulseProjectDir
    environment 'REACT_APP_BACKEND_URL', 'https://api.pulse-messenger.com'
    environment 'REACT_APP_API_URL', 'https://api.pulse-messenger.com'
    environment 'REACT_APP_NATIVE_API_URL', ''
    if (pulseE2eePilot) {
        environment 'REACT_APP_E2EE_MODE', 'signal'
        environment 'REACT_APP_E2EE_TRANSPORT', 'v2'
        environment 'REACT_APP_E2EE_V2_PILOT_ENABLED', 'true'
        environment 'REACT_APP_E2EE_V2_BROWSER_PILOT_ENABLED', 'false'
    }
    commandLine 'npm', 'run', 'build:webapp'
}

def verifyE2eePilotReleaseGate = tasks.register('verifyE2eePilotReleaseGate', Exec) {
    onlyIf { pulseE2eePilot }
    workingDir pulseProjectDir
    commandLine 'npm', 'run', 'verify:e2ee:security-review'
}

buildReleaseWebAssets.configure {
    dependsOn verifyE2eePilotReleaseGate
}

def copyReleaseWebAssets = tasks.register('copyReleaseWebAssets', Exec) {
    dependsOn buildReleaseWebAssets
    workingDir pulseProjectDir
    commandLine file("${pulseProjectDir}/node_modules/.bin/cap"), 'copy', 'android'
}

def androidReleasePublicDir = file('src/main/assets/public')

def pruneReleaseAndroidAssets = tasks.register('pruneReleaseAndroidAssets', Delete) {
    dependsOn copyReleaseWebAssets

    // Marketing media belongs to the public website, not the authenticated native app.
    delete file("${androidReleasePublicDir}/screenshots"), file("${androidReleasePublicDir}/videos")

    // Android loads the stable aliases; hashed and legacy aliases are duplicate payloads.
    delete fileTree(dir: file("${androidReleasePublicDir}/static/js"), include: ['main.*.js'])
        .matching { exclude 'main.latest.js' }
    delete fileTree(dir: file("${androidReleasePublicDir}/static/css"), include: ['main.*.css'])
        .matching { exclude 'main.latest.css' }
}

def verifyReleaseWebAssets = tasks.register('verifyReleaseWebAssets') {
    dependsOn pruneReleaseAndroidAssets
    inputs.files(releaseMainBundles)
    doLast {
        def mainBundles = releaseMainBundles.files
        if (mainBundles.isEmpty()) {
            throw new GradleException('Geen gesynchroniseerde Pulse-webbundle gevonden voor de release-build.')
        }

        def bundledJavascript = mainBundles.collect { it.getText('UTF-8') }.join('\n')
        def containsNativeHttpOverride = bundledJavascript.contains('REACT_APP_NATIVE_API_URL:"http://') ||
            bundledJavascript.contains('"REACT_APP_NATIVE_API_URL":"http://')
        if (containsNativeHttpOverride) {
            throw new GradleException(
                'Release geblokkeerd: de Android-webbundle bevat een lokale REACT_APP_NATIVE_API_URL.'
            )
        }
        if (!bundledJavascript.contains('https://api.pulse-messenger.com')) {
            throw new GradleException(
                'Release geblokkeerd: de Android-webbundle bevat de productie-API niet.'
            )
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn verifyReleaseWebAssets
    doFirst {
        if (pulseE2eePilot && pulseNativeUpdatePublicKey.trim().isEmpty()) {
            throw new GradleException(
                'E2EE pilot-release geblokkeerd: PULSE_NATIVE_UPDATE_PUBLIC_KEY ontbreekt.'
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-telecom:1.0.0"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "io.github.webrtc-sdk:android:144.7559.15"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "org.signal:libsignal-client:$libsignalVersion"
    implementation "org.signal:libsignal-android:$libsignalVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:app-update-ktx:2.1.0"
    implementation platform("com.google.firebase:firebase-bom:34.17.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-auth"
    implementation("io.socket:socket.io-client:2.1.2") {
        exclude group: "org.json", module: "json"
    }
}

apply from: 'capacitor.build.gradle'
apply from: '../release-notices.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
