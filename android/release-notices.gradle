import groovy.json.JsonOutput
import groovy.xml.XmlSlurper
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.security.MessageDigest

tasks.register('generateReleaseRuntimeNoticeInventory') {
    group = 'verification'
    description = 'Writes the resolved release runtime modules and Maven POM licenses.'
    notCompatibleWithConfigurationCache('Resolves Maven POM artifacts for release evidence.')

    def outputFile = layout.buildDirectory.file('reports/release-notices/resolved-components.json')
    outputs.file(outputFile)
    outputs.upToDateWhen { false }

    doLast {
        def cachedPom = { String group, String module, String version ->
            def moduleCache = new File(
                gradle.gradleUserHomeDir,
                "caches/modules-2/files-2.1/${group}/${module}/${version}",
            )
            def pomFiles = moduleCache.exists()
                ? fileTree(moduleCache) { include "**/${module}-${version}.pom" }.files
                : []
            if (pomFiles.size() != 1) {
                throw new FileNotFoundException(
                    "Expected one cached POM for ${group}:${module}:${version}, found ${pomFiles.size()}",
                )
            }
            pomFiles.first()
        }
        def fileSha256 = { File file ->
            MessageDigest.getInstance('SHA-256')
                .digest(file.bytes)
                .encodeHex()
                .toString()
        }
        def licenseMetadata
        licenseMetadata = { File pomFile, String coordinate, int depth ->
            if (depth > 8) {
                throw new IllegalStateException("POM parent depth exceeded for ${coordinate}")
            }
            def pom = new XmlSlurper(false, false).parse(pomFile)
            def licenses = pom.licenses.license.collect { license ->
                [
                    name: license.name.text().trim(),
                    url: license.url.text().trim(),
                    distribution: license.distribution.text().trim(),
                ]
            }.findAll { it.name || it.url }
            if (licenses) {
                return [
                    licenses: licenses,
                    source: coordinate,
                    sourcePomSha256: fileSha256(pomFile),
                ]
            }

            def parent = pom.parent
            def parentGroup = parent.groupId.text().trim()
            def parentModule = parent.artifactId.text().trim()
            def parentVersion = parent.version.text().trim()
            if (!parentGroup || !parentModule || !parentVersion) {
                return [licenses: [], source: coordinate, sourcePomSha256: fileSha256(pomFile)]
            }
            def parentCoordinate = "${parentGroup}:${parentModule}:${parentVersion}"
            licenseMetadata(
                cachedPom(parentGroup, parentModule, parentVersion),
                parentCoordinate,
                depth + 1,
            )
        }

        def componentIds = configurations.releaseRuntimeClasspath
            .incoming
            .resolutionResult
            .allComponents
            .collect { it.id }
            .findAll { it instanceof ModuleComponentIdentifier }
            .unique { "${it.group}:${it.module}:${it.version}" }
            .sort { left, right ->
                "${left.group}:${left.module}:${left.version}" <=>
                    "${right.group}:${right.module}:${right.version}"
            }

        def components = componentIds.collect { id ->
            def coordinate = "${id.group}:${id.module}:${id.version}"
            def licenses = []
            def pomStatus = 'resolved'

            def pomSha256 = ''
            def licenseSource = ''
            def licenseSourcePomSha256 = ''

            try {
                def pomFile = cachedPom(id.group, id.module, id.version)
                pomSha256 = fileSha256(pomFile)
                def metadata = licenseMetadata(pomFile, coordinate, 0)
                licenses = metadata.licenses
                licenseSource = metadata.source
                licenseSourcePomSha256 = metadata.sourcePomSha256
            } catch (Exception error) {
                pomStatus = "unavailable:${error.class.simpleName}"
            }

            [
                id: "${id.group}:${id.module}",
                version: id.version,
                pomStatus: pomStatus,
                pomSha256: pomSha256,
                licenseSource: licenseSource,
                licenseSourcePomSha256: licenseSourcePomSha256,
                licenses: licenses,
            ]
        }

        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion: 1,
            configuration: 'releaseRuntimeClasspath',
            components: components,
        ])) + '\n'

        println "Pulse release notice inventory: ${components.size()} components -> ${target}"
    }
}
